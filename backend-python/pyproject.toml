[project]
name = "gen-image-layer-separator"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.1.0",
    "pydantic-settings>=2.6.0",
    "google-genai>=1.10.0",
    "Pillow>=11.0.0",
    "fonttools>=4.55.0",
    "transformers>=4.47.0",
    "torch>=2.5.0",
    "numpy>=2.1.0",
    "aiofiles>=24.1.0",
    "rembg>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 120
